<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Monthly Dashboard</title>
    <style>
      :root {
        --ink: #0B1220;
        --panel: #121B2E;
        --panel-border: #1E293F;
        --text: #E6EDF3;
        --muted: #8592A6;
        --amber: #FFB020;
        --teal: #2BD9B9;
        --red: #FF5C5C;
      }
      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: var(--ink);
        color: var(--text);
      }
      .container { max-width: 1200px; margin: 0 auto; padding: 24px; }
      .card {
        background: var(--panel);
        border: 1px solid var(--panel-border);
        border-radius: 12px;
        padding: 20px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.35);
        margin-bottom: 20px;
      }
      h1, h2 { color: var(--teal); margin-top: 0; }
      a.back-link {
        display: inline-block;
        color: var(--amber);
        font-weight: 700;
        text-decoration: none;
        margin-bottom: 12px;
      }
      a.back-link:hover { text-decoration: underline; }
      table { width: 100%; border-collapse: collapse; margin-top: 12px; }
      th, td { border: 1px solid var(--panel-border); padding: 10px; text-align: left; }
      th { background: var(--ink); color: var(--teal); }
      td { color: var(--text); }
      tr:nth-child(even) td { background: rgba(255,255,255,0.02); }
      .muted { color: var(--muted); }
      .chart-wrap { min-height: 320px; }
      .chart-wrap canvas { height: 320px !important; }
      .pill { display: inline-block; padding: 4px 8px; border-radius: 999px; background: rgba(43,217,185,0.12); color: var(--teal); font-weight: 700; }
      .status-banner {
        padding: 12px 16px;
        border-radius: 8px;
        margin-top: 12px;
        font-weight: 600;
      }
      .status-banner.error { background: rgba(255,92,92,0.12); color: var(--red); border: 1px solid rgba(255,92,92,0.35); }
      .status-banner.loading { background: rgba(255,176,32,0.10); color: var(--amber); border: 1px solid rgba(255,176,32,0.3); }
      .status-banner.empty { background: rgba(133,146,166,0.10); color: var(--muted); border: 1px solid var(--panel-border); }
      .status-banner.empty .empty-title { color: var(--text); display: block; margin-bottom: 4px; font-weight: 700; }
      .pagination {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 12px;
        margin-top: 14px;
      }
      .pagination button {
        background: transparent;
        border: 1px solid var(--panel-border);
        color: var(--text);
        border-radius: 6px;
        padding: 6px 14px;
        font-weight: 700;
        cursor: pointer;
      }
      .pagination button:hover:not(:disabled) { border-color: var(--amber); color: var(--amber); }
      .pagination button:disabled { opacity: 0.35; cursor: not-allowed; }
      .pagination .page-info { color: var(--muted); font-weight: 600; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body>
    <div class="container">
      <div class="card">
        <a class="back-link" href="/">← Back to Report Generator</a>
        <h1>Monthly Dashboard</h1>
        <p class="muted">Historical weekly metrics</p>
      </div>
      <div class="card">
        <h2>Monthly Rollup</h2>
        <div id="rollup"></div>
        <div id="rollup-pagination"></div>
      </div>
      <div class="card">
        <h2>Weekly History</h2>
        <div id="table"></div>
        <div id="table-pagination"></div>
      </div>
      <div class="card">
        <h2>Trend Chart</h2>
        <div class="chart-wrap" id="chart-wrap">
          <canvas id="chart"></canvas>
        </div>
      </div>
    </div>

    <script>
      const rollupEl = document.getElementById('rollup');
      const rollupPaginationEl = document.getElementById('rollup-pagination');
      const tableEl = document.getElementById('table');
      const paginationEl = document.getElementById('table-pagination');
      const chartWrapEl = document.getElementById('chart-wrap');

      const WEEKLY_PAGE_SIZE = 10;
      const ROLLUP_PAGE_SIZE = 6;

      let allRows = [];
      let currentPage = 1;

      let allRollupRows = [];
      let currentRollupPage = 1;

      function showBanner(el, message, type) {
        el.innerHTML = `<div class="status-banner ${type}">${message}</div>`;
      }

      // Generic paginator: renders a table into tableTarget and controls into pageTarget.
      function renderPage(opts) {
        const { rows, page, pageSize, tableTarget, pageTarget, columns, onPageChange } = opts;
        const totalPages = Math.max(1, Math.ceil(rows.length / pageSize));
        const clampedPage = Math.min(Math.max(1, page), totalPages);
        const start = (clampedPage - 1) * pageSize;
        const pageRows = rows.slice(start, start + pageSize);

        tableTarget.innerHTML = `
          <table>
            <thead>
              <tr>${columns.map((c) => `<th>${c.label}</th>`).join('')}</tr>
            </thead>
            <tbody>
              ${pageRows
                .map(
                  (row) =>
                    `<tr>${columns.map((c) => `<td>${row[c.key] ?? 0}</td>`).join('')}</tr>`
                )
                .join('')}
            </tbody>
          </table>
        `;

        if (totalPages <= 1) {
          pageTarget.innerHTML = `<div class="pagination"><span class="page-info">${rows.length} ${rows.length === 1 ? 'row' : 'rows'}</span></div>`;
          return clampedPage;
        }

        pageTarget.innerHTML = `
          <div class="pagination">
            <span class="page-info">Page ${clampedPage} of ${totalPages} (${rows.length} rows)</span>
            <button class="prev-page" ${clampedPage <= 1 ? 'disabled' : ''}>Previous</button>
            <button class="next-page" ${clampedPage >= totalPages ? 'disabled' : ''}>Next</button>
          </div>
        `;

        pageTarget.querySelector('.prev-page')?.addEventListener('click', () => {
          if (clampedPage > 1) onPageChange(clampedPage - 1);
        });
        pageTarget.querySelector('.next-page')?.addEventListener('click', () => {
          if (clampedPage < totalPages) onPageChange(clampedPage + 1);
        });

        return clampedPage;
      }

      function renderWeeklyTable() {
        currentPage = renderPage({
          rows: allRows,
          page: currentPage,
          pageSize: WEEKLY_PAGE_SIZE,
          tableTarget: tableEl,
          pageTarget: paginationEl,
          columns: [
            { key: 'report_date', label: 'Report Date' },
            { key: 'total_issues', label: 'Total Issues' },
            { key: 'critical_high', label: 'Critical/High' },
            { key: 'in_progress', label: 'In Progress' },
            { key: 'resolved', label: 'Resolved' },
            { key: 'pending', label: 'Pending' },
          ],
          onPageChange: (p) => {
            currentPage = p;
            renderWeeklyTable();
          },
        });
      }

      function renderRollupTable() {
        currentRollupPage = renderPage({
          rows: allRollupRows,
          page: currentRollupPage,
          pageSize: ROLLUP_PAGE_SIZE,
          tableTarget: rollupEl,
          pageTarget: rollupPaginationEl,
          columns: [
            { key: 'month', label: 'Month' },
            { key: 'resolved', label: 'Resolved This Month' },
            { key: 'pending', label: 'Latest Pending' },
          ],
          onPageChange: (p) => {
            currentRollupPage = p;
            renderRollupTable();
          },
        });
      }

      function renderChart(chartRows) {
        if (!chartRows || chartRows.length === 0) {
          chartWrapEl.innerHTML = `
            <div class="status-banner empty">
              <span class="empty-title">No trend to show yet</span>
              Once you've generated a couple of weekly reports, this chart will plot total issues, resolved, and pending over time.
            </div>
          `;
          return;
        }

        // Rebuild the canvas in case a previous render replaced it with the empty-state banner.
        chartWrapEl.innerHTML = '<canvas id="chart"></canvas>';
        const ctx = document.getElementById('chart');

        const labels = chartRows.map((row) => row.report_date);
        const totalIssues = chartRows.map((row) => row.total_issues || 0);
        const resolved = chartRows.map((row) => row.resolved || 0);
        const pending = chartRows.map((row) => row.pending || 0);

        new Chart(ctx, {
          type: 'line',
          data: {
            labels,
            datasets: [
              { label: 'Total Issues', data: totalIssues, borderColor: '#5B7290', backgroundColor: 'rgba(91,114,144,0.15)', tension: 0.35 },
              { label: 'Resolved', data: resolved, borderColor: '#2BD9B9', backgroundColor: 'rgba(43,217,185,0.15)', tension: 0.35 },
              { label: 'Pending', data: pending, borderColor: '#FFB020', backgroundColor: 'rgba(255,176,32,0.15)', tension: 0.35 },
            ],
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
              y: { beginAtZero: true, ticks: { color: '#8592A6' }, grid: { color: 'rgba(255,255,255,0.06)' } },
              x: { ticks: { color: '#8592A6' }, grid: { color: 'rgba(255,255,255,0.06)' } },
            },
            plugins: {
              legend: { labels: { color: '#E6EDF3' } },
            },
          },
        });
      }

      async function loadDashboard() {
        showBanner(rollupEl, 'Loading monthly rollup…', 'loading');
        rollupPaginationEl.innerHTML = '';
        showBanner(tableEl, 'Loading weekly history…', 'loading');
        paginationEl.innerHTML = '';
        chartWrapEl.innerHTML = '<div class="status-banner loading">Loading trend chart…</div>';

        let data;
        try {
          const response = await fetch('/api/dashboard');
          if (!response.ok) {
            throw new Error(`Request failed with status ${response.status}`);
          }
          data = await response.json();
        } catch (error) {
          const message = `Failed to load dashboard data: ${error.message}`;
          showBanner(rollupEl, message, 'error');
          rollupPaginationEl.innerHTML = '';
          showBanner(tableEl, message, 'error');
          paginationEl.innerHTML = '';
          showBanner(chartWrapEl, message, 'error');
          return;
        }

        // Monthly rollup — most-recent-first, paginated.
        allRollupRows = data.monthly_rollup ? [...data.monthly_rollup].reverse() : [];
        if (allRollupRows.length === 0) {
          showBanner(rollupEl, 'No monthly data yet. Generate a report to get started.', 'empty');
          rollupPaginationEl.innerHTML = '';
        } else {
          currentRollupPage = 1;
          renderRollupTable();
        }

        // Weekly history — most-recent-first, paginated.
        allRows = data.rows ? [...data.rows].reverse() : [];
        if (allRows.length === 0) {
          showBanner(tableEl, 'No weekly reports recorded yet.', 'empty');
          paginationEl.innerHTML = '';
        } else {
          currentPage = 1;
          renderWeeklyTable();
        }

        // Trend chart — chronological order, with a friendly message when there's no data.
        renderChart(data.rows || []);
      }

      loadDashboard();
    </script>
  </body>
</html>
